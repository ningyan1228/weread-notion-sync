name: weread notion sync
description: Sync WeRead books, highlights and notes to a Notion gallery database.
author: weread-notion-sync contributors

inputs:
  weread-api-key:
    description: WeRead Gateway API key.
    required: false
  notion-token:
    description: Notion integration token.
    required: true
  notion-page:
    description: Notion database page URL, database ID, or data source ID.
    required: false
  notion-database-id:
    description: Notion database ID. Used when notion-page is not set.
    required: false
  notion-data-source-id:
    description: Notion data source ID. Preferred for Notion-Version 2026-03-11.
    required: false
  full-sync:
    description: Set to true to ignore the Sort cursor and resync all books.
    required: false
    default: "false"
  python-version:
    description: Python version used to run the sync.
    required: false
    default: "3.11"
  command:
    description: Command to run. Use setup to create the Notion database, or sync to sync books.
    required: false
    default: "sync"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install package
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "$GITHUB_ACTION_PATH"
    - name: Sync WeRead to Notion
      shell: bash
      env:
        WEREAD_API_KEY: ${{ inputs.weread-api-key }}
        NOTION_TOKEN: ${{ inputs.notion-token }}
        NOTION_PAGE: ${{ inputs.notion-page }}
        NOTION_DATABASE_ID: ${{ inputs.notion-database-id }}
        NOTION_DATA_SOURCE_ID: ${{ inputs.notion-data-source-id }}
        WEREAD_NOTION_FULL_SYNC: ${{ inputs.full-sync }}
      run: weread-notion ${{ inputs.command }}
